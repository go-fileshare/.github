name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This repository is one README, and its failure mode is silent: an image
  # that 404s renders as a broken box on the org's front page, and a link to a
  # repo that was renamed goes nowhere. Neither breaks anything that would
  # complain.
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          set -uo pipefail
          # The character class matters: markdown wraps a bare URL in angle
          # brackets, and an extractor that stops only at ) and " carries the
          # closing > into the request. This check failed on its own first run
          # for exactly that, which is the cheapest possible way to find out.
          urls=$(grep -oE 'https?://[^)">< [:space:]]+' profile/README.md | sed 's/[.,]$//' | sort -u)
          test -n "$urls" || { echo "::error::no links found; is the README still there?"; exit 1; }
          fail=0
          while read -r u; do
            # img.shields.io renders anything asked of it and proves nothing.
            case "$u" in *img.shields.io*) continue ;; esac
            # ⛔ Three attempts, because ONE is a flake detector rather than a
            # link checker. Running this locally, github.com answered 000 --
            # a connection that never completed -- for a repository that
            # exists, and 200 on each of the next three tries. A lane that
            # fails at random is a lane people learn to ignore, which is worse
            # than not having it.
            code=000
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" || echo 000)
              case "$code" in 2*|3*) break ;; esac
              sleep 3
            done
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$u" ;;
              *)     printf '  FAIL %s  %s\n' "$code" "$u"; fail=1 ;;
            esac
          done <<< "$urls"
          test "$fail" -eq 0 || { echo "::error::at least one link or image does not resolve"; exit 1; }
